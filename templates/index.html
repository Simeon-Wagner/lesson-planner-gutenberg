{% block content %}
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<h1 class="d-none">{% block title %} Colegio Gutenberg {% endblock %}</h1>

<script>
  $(document).ready(function () {

    $("#downloadHTMLBtn").hide()
    // Generate lesson planner
    $("#submitBtn").click(function (e) {
      e.preventDefault();

      const formData = new FormData();
      formData.append("subject", $("#subject").val());
      formData.append("level", $("#level").val());
      formData.append("periods", $("#period").val());
      formData.append("topic", $("#topic").val());
      formData.append("learning_obj", $("#learning_obj").val());
      formData.append("model", $("#model").val());

      const fileInput = $("#htmlUpload")[0];
      if (fileInput.files.length > 0) {
        formData.append("previous_lesson_plan", fileInput.files[0]);
      }

      $("#lp-response").html(`
        <div class="text-center my-3">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2">Generando el plan de clase...</p>
        </div>
      `);
      
      $("#submitBtn").hide()

      $.ajax({
        url: "/generateLessonPlan",
        type: "POST",
        timeout:180000,
        data: formData,
        contentType: false,
        processData: false,
        success: function(response) {
          const answer = response.answer;
          const pages = response.pages;

          let html = `<div class="card mb-3">
                        <div class="card-body">
                          <h5 class="card-title">Generated Lesson Plan</h5>
                          <p class="card-text">${answer}</p>                         
                        </div>
                      </div>`;

          $("#lp-response").html(html);
          // It is possible to regenerate a lesson plan
          $("#submitBtn").show();
          //Show Download to PDF button
          $("#downloadHTMLBtn").show();
          
        },
        error: function (xhr, status, error) {
          $("#lp-response").html(`<div class="alert alert-danger">Error: ${error}</div>`);  
          $("#submitBtn").show();
        }
      });
    });   // generate lesson planner

    $("#downloadHTMLBtn").click(function () {
      const content = $("#lp-response").html();
      const fullHtml = `
        <!DOCTYPE html>
        <html>
        <head><meta charset="UTF-8"><title>Exported HTML</title></head>
        <body>${content}</body>
        </html>
      `;

      const blob = new Blob([fullHtml], { type: "text/html" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "exported.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }) 
  }); 

</script>

<div class="container py-5">
  <div class="text-center mb-4">
    <h2 class="mb-3">Lesson Plan Generator</h2>
    <p class="text-muted">Colegio Gutenberg</p>
  </div>

  <form enctype="multipart/form-data">

    <div class="row mb-4">

      <div class="col-md-4">
        <label for="subject" class="form-label">Materia</label>
        <select id="subject" class="form-select">
          {% for subject in subjects %}
          <option value="{{subject.value}}">{{subject.label}}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label for="level" class="form-label">Grado</label>
        <select id="level" class="form-select">
          {% for level in levels %}
          <option value="{{level.value}}">{{level.label}}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label for="period" class="form-label">Horas</label>
        <select id="period" class="form-select">
          {% for period in periods %}
          <option value="{{period.value}}">{{period.label}}</option>
          {% endfor %}
        </select>
      </div>

    </div>

    <div class="row mb-4">

      <div class="col-md-4">
        <label for="topic" class="form-label">Tema</label>
        <textarea id="topic" class="form-control" rows="5" placeholder="Escriba el tema"></textarea>
      </div>

      <div class="col-md-4">
        <label for="learning_obj" class="form-label">Objetivos de aprendizaje</label>
        <textarea id="learning_obj" class="form-control" rows="5" placeholder="Learning Objectives"></textarea>
      </div>

    
  <div class="col-md-4">

    <div class="row mb-4">
      <label for="model" class="form-label">Models</label>
      <select id="model" class="form-select">
        {% for model in models %}
        <option value="{{model.value}}">{{model.label}}</option>
        {% endfor %}
      </select>
    </div>

    <div class="row mb-3">
      <label for="htmlUpload" class="form-label"> Subir planificación de clases anteriores </label>
      <input type="file" id="htmlUpload" name="htmlUpload" class="form-control" accept="application/html">
    </div>

    
  </div>
  </div>



  <div class="text-center">
    <button id="submitBtn" class="btn btn-primary">Generar Plan</button>
  </div>
</form>


  <div id="lp-response" class="mt-4">
    
  </div>
  <div  class="text-center">
    <button id="downloadHTMLBtn" class="btn btn-primary">Descargar Plan</button>
  </div>
</div>
{% endblock %}
