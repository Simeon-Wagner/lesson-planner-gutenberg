{% block content %}
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<h1 class="d-none">{% block title %} Colegio Gutenberg {% endblock %}</h1>

<script>
  $(document).ready(function () {
    $("#submitBtn").click(function (e) {
      e.preventDefault();

      const data = {
        subject: $("#subject").val(),
        level: $("#level").val(),
        topic: $("#topic").val()
      };

      $.ajax({
        url: "/generateLessonPlan",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify(data),
        success: function(response) {
          const answer = response.answer;
          const pages = response.pages;

          let html = `<div class="card mb-3">
                        <div class="card-body">
                          <h5 class="card-title">Generated Lesson Plan</h5>
                          <p class="card-text">${answer}</p>
                          <p class="text-muted"><strong>Suggested Pages:</strong> ${pages.join(', ')}</p>
                        </div>
                      </div>`;

          $("#lp-response").html(html);
        },
        error: function (xhr, status, error) {
          $("#lp-response").html(`<div class="alert alert-danger">Error: ${error}</div>`);
        }
      });
    });
  });
</script>

<div class="container py-5">
  <div class="text-center mb-4">
    <h2 class="mb-3">Lesson Plan Generator</h2>
    <p class="text-muted">Colegio Gutenberg</p>
  </div>

  <form>
    <div class="row mb-3">
      <div class="col-md-4">
        <label for="subject" class="form-label">Materia</label>
        <select id="subject" class="form-select">
          {% for subject in subjects %}
          <option value="{{subject.label}}">{{subject.label}}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label for="level" class="form-label">Grado</label>
        <select id="level" class="form-select">
          {% for level in levels %}
          <option value="{{level.label}}">{{level.label}}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label for="topic" class="form-label">Tema</label>
        <input type="text" id="topic" class="form-control" placeholder="Escriba el tema">
      </div>
    </div>

    <div class="text-center">
      <button id="submitBtn" class="btn btn-primary">Generar Plan</button>
    </div>
  </form>

  <div id="lp-response" class="mt-4"></div>
</div>
{% endblock %}
