{% block content %}
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<h1 class="d-none">{% block title %} Colegio Gutenberg {% endblock %}</h1>

<script>
  $(document).ready(function () {
    $("#submitBtn").click(function (e) {
      e.preventDefault();

      const data = {
        subject: $("#subject").val(),
        level: $("#level").val(),
        periods: $("#period").val(),
        topic: $("#topic").val(),
        learning_obj: $("#learning_obj").val()
      };

      $("#lp-response").html(`
        <div class="text-center my-3">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2">Generando el plan de clase...</p>
        </div>
      `);

      $.ajax({
        url: "/generateLessonPlan",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify(data),
        success: function(response) {
          const answer = response.answer;
          const pages = response.pages;

          let html = `<div class="card mb-3">
                        <div class="card-body">
                          <h5 class="card-title">Generated Lesson Plan</h5>
                          <p class="card-text">${answer}</p>
                          <p class="text-muted"><strong>Suggested Pages:</strong> ${pages.join(', ')}</p>
                        </div>
                      </div>`;

          $("#lp-response").html(html);
        },
        error: function (xhr, status, error) {
          $("#lp-response").html(`<div class="alert alert-danger">Error: ${error}</div>`);  
        }
      });
    });
  });
</script>

<div class="container py-5">
  <div class="text-center mb-4">
    <h2 class="mb-3">Lesson Plan Generator</h2>
    <p class="text-muted">Colegio Gutenberg</p>
  </div>

  <form enctype="multipart/form-data">
  <div class="row mb-4">
    <div class="col-md-4">
      <label for="subject" class="form-label">Materia</label>
      <select id="subject" class="form-select">
        {% for subject in subjects %}
        <option value="{{subject.value}}">{{subject.label}}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4">
      <label for="level" class="form-label">Grado</label>
      <select id="level" class="form-select">
        {% for level in levels %}
        <option value="{{level.value}}">{{level.label}}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4">
      <label for="period" class="form-label">Horas</label>
      <select id="period" class="form-select">
        {% for period in periods %}
        <option value="{{period.value}}">{{period.label}}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-6">
      <label for="topic" class="form-label">Tema</label>
      <textarea id="topic" class="form-control" rows="3" placeholder="Escriba el tema"></textarea>
    </div>

    <div class="col-md-6">
      <label for="learning_obj" class="form-label">Objetivos de aprendizaje</label>
      <textarea id="learning_obj" class="form-control" rows="3" placeholder="Learning Objectives"></textarea>
    </div>
  </div>

  <!-- <div class="row mb-4">
    <div class="col-md-6">
      <label for="pdfUpload" class="form-label">Subir archivo PDF (opcional)</label>
      <input type="file" id="pdfUpload" name="pdfUpload" class="form-control" accept="application/pdf">
    </div>
  </div> -->

  <div class="text-center">
    <button id="submitBtn" class="btn btn-primary">Generar Plan</button>
  </div>
</form>


  <div id="lp-response" class="mt-4"></div>
</div>
{% endblock %}
